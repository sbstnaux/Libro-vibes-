<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Libro Vibes · Recomendador de libros</title>
  <meta name="description" content="Escribe un libro que te gustó y descubre otros parecidos." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Libro Vibes</h1>
      <p class="lede">Escribe un libro que te gustó y te armamos una repisa con otros que se le parecen.</p>
    </header>

    <form id="search-form" class="search" autocomplete="off" novalidate>
      <label for="book-input" class="visually-hidden">Título del libro</label>
      <div class="search-field">
        <input id="book-input" name="libro" type="text" placeholder="Por ejemplo: The Hobbit"
               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" required />
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>
      <button type="submit" id="submit-btn">Buscar parecidos</button>
    </form>

    <section class="shelf-area" aria-live="polite">
      <p id="status" class="status"></p>
      <div class="shelf-scroll">
        <div id="shelf" class="shelf" role="list"></div>
      </div>
      <div class="plank" aria-hidden="true"></div>
      <article id="detail" class="detail" hidden></article>
    </section>
  </main>

  <footer class="footer">
    <p>Recomendaciones por similitud de contenido (TF-IDF) sobre datos de Goodreads.</p>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
